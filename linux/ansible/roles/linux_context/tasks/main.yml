---
- name: Set repository paths
  ansible.builtin.set_fact:
    ansible_root: "{{ playbook_dir | dirname }}"
    repo_root: "{{ playbook_dir | dirname | dirname | dirname }}"

- name: Determine target user
  ansible.builtin.set_fact:
    resolved_target_user: >-
      {{
        target_user
        if target_user | length > 0
        else (
          lookup('ansible.builtin.env', 'SUDO_USER')
          if lookup('ansible.builtin.env', 'SUDO_USER') | length > 0 and lookup('ansible.builtin.env', 'SUDO_USER') != 'root'
          else ansible_user_id
        )
      }}

- name: Read target user account
  ansible.builtin.getent:
    database: passwd
    key: "{{ resolved_target_user }}"

- name: Read target user's primary group
  ansible.builtin.command: "id -gn {{ resolved_target_user }}"
  register: target_group_lookup
  changed_when: false
  check_mode: false

- name: Set target user facts
  ansible.builtin.set_fact:
    resolved_target_home: "{{ target_home if target_home | length > 0 else ansible_facts.getent_passwd[resolved_target_user][4] }}"
    resolved_target_uid: "{{ ansible_facts.getent_passwd[resolved_target_user][1] }}"
    resolved_target_gid: "{{ ansible_facts.getent_passwd[resolved_target_user][2] }}"
    resolved_target_group: "{{ target_group_lookup.stdout }}"
    is_wsl: "{{ 'microsoft' in ansible_kernel | lower }}"

- name: Set target command environment
  ansible.builtin.set_fact:
    target_user_environment:
      HOME: "{{ resolved_target_home }}"
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin:{{ resolved_target_home }}/.local/bin:{{ resolved_target_home }}/snap/node/current/bin"
      XDG_RUNTIME_DIR: "/run/user/{{ resolved_target_uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ resolved_target_uid }}/bus"
