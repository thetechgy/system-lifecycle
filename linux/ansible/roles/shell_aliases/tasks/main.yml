---
- name: Configure system-lifecycle aliases
  ansible.builtin.blockinfile:
    path: "{{ shell_aliases_file }}"
    create: "{{ shell_aliases_state == 'present' }}"
    backup: true
    marker: "# {mark}"
    marker_begin: ">>> system-lifecycle >>>"
    marker_end: "<<< system-lifecycle <<<"
    block: |
      # Aliases managed by system-lifecycle - do not edit manually
      alias linux-update='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/update-system.yml"'
      alias linux-update-check='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/update-system.yml" --check'
      alias linux-update-firmware='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/update-system.yml" -e update_firmware=true'
      alias linux-workstation='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/install-workstation.yml"'
      alias linux-workstation-check='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/install-workstation.yml" --check'
      alias linux-workstation-apps='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/install-workstation.yml" --tags apps'
      alias linux-workstation-devtools='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/install-workstation.yml" --tags devtools'
      alias linux-security='"{{ ansible_root }}/scripts/ensure-ansible.sh" && ANSIBLE_CONFIG="{{ ansible_root }}/ansible.cfg" ansible-playbook -K "{{ ansible_root }}/playbooks/install-workstation.yml" --tags security'
    state: "{{ shell_aliases_state }}"
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
