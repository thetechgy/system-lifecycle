---
- name: Check whether snap is installed
  ansible.builtin.command: snap --version
  register: node_snap_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail when snap is missing for Node.js management
  ansible.builtin.fail:
    msg: "snap is required to manage Node.js in this project."
  when: node_snap_check.rc != 0

- name: Check whether snap Node.js is installed
  ansible.builtin.command: snap list node
  register: node_snap_list
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Refresh snap Node.js channel
  ansible.builtin.command: "snap refresh node --channel={{ nodejs_version }}"
  register: node_snap_refresh
  changed_when: node_snap_refresh.rc == 0
  when:
    - node_snap_list.rc == 0
    - not ansible_check_mode
  become: true

- name: Install snap Node.js
  ansible.builtin.command: "snap install node --classic --channel={{ nodejs_version }}"
  register: node_snap_install
  changed_when: node_snap_install.rc == 0
  when:
    - node_snap_list.rc != 0
    - not ansible_check_mode
  become: true

- name: Explain skipped Node.js change
  ansible.builtin.debug:
    msg: "Check mode: would ensure Node.js {{ nodejs_version }}.x is installed from snap."
  when: ansible_check_mode
