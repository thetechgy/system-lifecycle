---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: "yes"
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true
  notify: reboot may be required

- name: Apply dist-upgrade
  ansible.builtin.apt:
    upgrade: dist
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true
  notify: reboot may be required
