---
- name: Ensure Node.js is installed from snap
  ansible.builtin.import_role:
    name: system_updates
    tasks_from: nodejs
  vars:
    update_nodejs: true
    update_npm: false
  tags: [nodejs]

- name: Install Microsoft products repository key
  ansible.builtin.import_tasks: microsoft_repo.yml

- name: Configure Microsoft products repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64,armhf signed-by={{ microsoft_keyring }}] https://packages.microsoft.com/ubuntu/24.04/prod noble main"
    filename: microsoft-prod
    state: present
    update_cache: true
  become: true

- name: Install developer packages
  ansible.builtin.apt:
    name:
      - powershell
      - gh
      - ripgrep
      - fd-find
      - jq
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true

- name: Add fd symlink when Ubuntu package provides fdfind only
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  become: true
  when: not ansible_check_mode

- name: Check whether Claude CLI exists for target user
  ansible.builtin.command: /bin/sh -c 'command -v claude >/dev/null 2>&1'
  register: claude_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"

- name: Download Claude CLI installer
  ansible.builtin.get_url:
    url: https://storage.googleapis.com/claudeai/claude-cli/install.sh
    dest: /tmp/claude-install.sh
    mode: "0755"
  when:
    - claude_check.rc != 0
    - not ansible_check_mode

- name: Install Claude CLI for target user
  ansible.builtin.command: /bin/sh /tmp/claude-install.sh
  register: claude_install
  changed_when: claude_install.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - claude_check.rc != 0
    - not ansible_check_mode

- name: Check whether npm is available for Codex CLI
  ansible.builtin.command: /bin/sh -c 'command -v npm >/dev/null 2>&1'
  register: codex_npm_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"

- name: Check whether Codex CLI is installed
  ansible.builtin.command: npm list -g @openai/codex
  register: codex_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when: codex_npm_check.rc == 0

- name: Install Codex CLI for target user
  ansible.builtin.command: npm install -g @openai/codex
  register: codex_install
  changed_when: codex_install.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - codex_npm_check.rc == 0
    - codex_check.rc | default(1) != 0
    - not ansible_check_mode
