---
- name: Ensure Node.js is installed from snap
  ansible.builtin.import_role:
    name: system_updates
    tasks_from: nodejs
  vars:
    update_nodejs: true
    update_npm: false
  tags: [nodejs]

- name: Install Microsoft products repository key
  ansible.builtin.import_tasks: microsoft_repo.yml

- name: Configure Microsoft products repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64,arm64,armhf signed-by={{ microsoft_keyring }}] https://packages.microsoft.com/ubuntu/24.04/prod noble main"
    filename: microsoft-prod
    state: present
    update_cache: true
  become: true

- name: Install developer packages
  ansible.builtin.apt:
    name:
      - powershell
      - gh
      - ripgrep
      - fd-find
      - jq
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true

- name: Add fd symlink when Ubuntu package provides fdfind only
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  become: true
  when: not ansible_check_mode

- name: Check whether npm is available for AI CLI management
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - npm
      - --version
  register: ai_cli_npm_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"

- name: Check whether Copilot CLI is installed
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - copilot
      - --version
  register: copilot_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"

- name: Update installed Copilot CLI
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - copilot
      - update
  register: copilot_update
  changed_when: copilot_update.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - copilot_check.rc == 0
    - not ansible_check_mode

- name: Install Copilot CLI for target user
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - npm
      - install
      - -g
      - "@github/copilot"
  register: copilot_install
  changed_when: copilot_install.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - ai_cli_npm_check.rc == 0
    - copilot_check.rc != 0
    - workstation_install_copilot_cli | bool
    - not ansible_check_mode

- name: Check whether Codex CLI is installed
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - npm
      - list
      - -g
      - "@openai/codex"
      - --depth=0
  register: codex_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when: ai_cli_npm_check.rc == 0

- name: Update npm-managed Codex CLI
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - npm
      - update
      - -g
      - "@openai/codex"
  register: codex_update
  changed_when: codex_update.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - ai_cli_npm_check.rc == 0
    - codex_check.rc | default(1) == 0
    - not ansible_check_mode

- name: Install Codex CLI for target user
  ansible.builtin.command:
    argv:
      - /usr/bin/env
      - npm
      - install
      - -g
      - "@openai/codex"
  register: codex_install
  changed_when: codex_install.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - ai_cli_npm_check.rc == 0
    - codex_check.rc | default(1) != 0
    - workstation_install_codex_cli | bool
    - not ansible_check_mode
