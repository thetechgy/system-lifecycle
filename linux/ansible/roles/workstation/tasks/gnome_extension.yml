---
- name: Validate {{ gnome_extension.name }} extension settings
  ansible.builtin.assert:
    that:
      - gnome_extension.uuid is match('^[A-Za-z0-9_.@+-]+$')
      - gnome_extension.dconf_path | length == 0 or gnome_extension.dconf_path is match('^/[A-Za-z0-9_/-]+/$')
      - gnome_extension.dconf_file | length == 0 or gnome_extension.dconf_file is match('^linux/ubuntu/install/configs/[A-Za-z0-9_.-]+$')
    fail_msg: "GNOME extension settings must use safe UUIDs, dconf paths, and repository config paths."

- name: Reset extension version tag
  ansible.builtin.set_fact:
    gnome_extension_version_tag: ""

- name: Check whether {{ gnome_extension.name }} is installed
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - list
  register: gnome_extension_list
  changed_when: false
  failed_when: false
  check_mode: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"

- name: Query {{ gnome_extension.name }} extension metadata
  ansible.builtin.uri:
    url: "https://extensions.gnome.org/extension-info/?uuid={{ gnome_extension.uuid | urlencode }}"
    return_content: true
  register: gnome_extension_info
  when:
    - gnome_extension.uuid not in (gnome_extension_list.stdout | default(''))
    - not ansible_check_mode

- name: Set {{ gnome_extension.name }} version tag
  ansible.builtin.set_fact:
    gnome_extension_version_tag: "{{ gnome_extension_info.json.shell_version_map[gnome_shell_major].pk | default('') }}"
  when:
    - gnome_extension_info is defined
    - gnome_extension_info.json is defined

- name: Download {{ gnome_extension.name }} extension
  ansible.builtin.get_url:
    url: "https://extensions.gnome.org/download-extension/{{ gnome_extension.uuid | urlencode }}.shell-extension.zip?version_tag={{ gnome_extension_version_tag }}"
    dest: "/tmp/{{ gnome_extension.uuid | regex_replace('[^A-Za-z0-9_.-]', '_') }}.zip"
    mode: "0644"
  when:
    - gnome_extension.uuid not in (gnome_extension_list.stdout | default(''))
    - gnome_extension_version_tag | default('') | length > 0
    - not ansible_check_mode

- name: Install {{ gnome_extension.name }} extension
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - install
      - --force
      - "/tmp/{{ gnome_extension.uuid | regex_replace('[^A-Za-z0-9_.-]', '_') }}.zip"
  register: gnome_extension_install
  changed_when: gnome_extension_install.rc == 0
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - gnome_extension.uuid not in (gnome_extension_list.stdout | default(''))
    - gnome_extension_version_tag | default('') | length > 0
    - not ansible_check_mode

- name: Enable {{ gnome_extension.name }} extension
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - enable
      - "{{ gnome_extension.uuid }}"
  changed_when: false
  failed_when: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when: not ansible_check_mode

- name: Apply {{ gnome_extension.name }} dconf configuration
  ansible.builtin.command:
    argv:
      - dconf
      - load
      - "{{ gnome_extension.dconf_path }}"
    stdin: "{{ lookup('file', repo_root + '/' + gnome_extension.dconf_file) }}"
  changed_when: false
  failed_when: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when:
    - gnome_extension.dconf_path | length > 0
    - gnome_extension.dconf_file | length > 0
    - not ansible_check_mode
