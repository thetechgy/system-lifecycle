---
- name: Install fastfetch
  ansible.builtin.apt:
    name: fastfetch
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  become: true

- name: Create fastfetch config directory
  ansible.builtin.file:
    path: "{{ resolved_target_home }}/.config/fastfetch"
    state: directory
    owner: "{{ resolved_target_user }}"
    group: "{{ resolved_target_group }}"
    mode: "0755"
  become: true

- name: Install fastfetch config
  ansible.builtin.copy:
    src: "{{ repo_root }}/linux/ubuntu/install/configs/fastfetch.jsonc"
    dest: "{{ resolved_target_home }}/.config/fastfetch/config.jsonc"
    owner: "{{ resolved_target_user }}"
    group: "{{ resolved_target_group }}"
    mode: "0644"
    backup: true
  become: true

- name: Test fastfetch config
  ansible.builtin.command: fastfetch
  changed_when: false
  failed_when: false
  become: "{{ resolved_target_user != ansible_user_id }}"
  become_user: "{{ resolved_target_user }}"
  environment: "{{ target_user_environment }}"
  when: not ansible_check_mode
