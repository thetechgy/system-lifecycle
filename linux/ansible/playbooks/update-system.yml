---
- name: Update Linux system
  hosts: localhost
  connection: local
  gather_facts: true

  pre_tasks:
    - name: Load local execution context
      ansible.builtin.include_role:
        name: linux_context
      tags: always

  roles:
    - role: system_updates
      tags: [update]

  post_tasks:
    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: always

    - name: Report reboot requirement
      ansible.builtin.debug:
        msg: "System reboot is required to complete updates."
      when: reboot_required_file.stat.exists
      tags: always
